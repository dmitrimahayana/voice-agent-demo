# Self-hosted n8n for Demo 5. Values come from .env next to this file (cp .env.example .env).
#   docker compose up -d        UI at http://localhost:5678
# Only the variables listed under `environment` reach the container (RETELL_API_KEY stays on your Mac).
services:
  n8n:
    image: n8nio/n8n:2.46.0
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - GENERIC_TIMEZONE=${TIMEZONE:-America/Denver}
      - TZ=${TIMEZONE:-America/Denver}
      - WEBHOOK_URL=${N8N_URL:-http://localhost:5678}
      # The workflows read their settings with $env, which n8n 2.x blocks by default.
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=168
      # Workflow settings
      - BRIGHTNEST_WEBHOOK_KEY=${BRIGHTNEST_WEBHOOK_KEY}
      - TIMEZONE=${TIMEZONE:-America/Denver}
      - GHL_BASE_URL=${GHL_BASE_URL:-}
      - GHL_API_TOKEN=${GHL_API_TOKEN}
      - GHL_LOCATION_ID=${GHL_LOCATION_ID}
      - GHL_CALENDAR_ID=${GHL_CALENDAR_ID}
      - GHL_PIPELINE_ID=${GHL_PIPELINE_ID}
      - GHL_STAGE_NEW=${GHL_STAGE_NEW}
      - GHL_STAGE_BOOKED=${GHL_STAGE_BOOKED}
      - GHL_STAGE_ATTENTION=${GHL_STAGE_ATTENTION}
      - GHL_RECURRING_PIPELINE_ID=${GHL_RECURRING_PIPELINE_ID:-}
      - GHL_RECURRING_STAGE_INTERESTED=${GHL_RECURRING_STAGE_INTERESTED:-}
      - SHEETS_WEBHOOK_URL=${SHEETS_WEBHOOK_URL:-}
      - SHEET_TAB=${SHEET_TAB:-demo5}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n:/workflows:ro

volumes:
  n8n_data:
