<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Speed-to-Lead Demo</title>
<style>
  :root { --bg:#f6f7fb; --card:#fff; --text:#111827; --muted:#6b7280; --accent:#2563eb; --line:#e5e7eb; }
  * { box-sizing:border-box; }
  body { margin:0; font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--text); }
  main { max-width:460px; margin:48px auto; padding:0 16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:24px; box-shadow:0 4px 20px rgba(0,0,0,.04); }
  h1 { font-size:24px; margin:0 0 4px; } p { color:var(--muted); margin:0 0 18px; }
  label { display:block; font-weight:600; font-size:14px; margin:14px 0 6px; }
  input, select, textarea { width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:9px; font:inherit; }
  button { margin-top:20px; width:100%; padding:13px; border:0; border-radius:9px; background:var(--accent); color:#fff; font-weight:700; font-size:16px; cursor:pointer; }
  button:disabled { opacity:.6; }
  #status { margin-top:16px; font-weight:600; min-height:24px; }
  .timer { font-variant-numeric:tabular-nums; color:var(--accent); }
</style>
</head>
<body>
<main>
  <div class="card">
    <h1 id="title">Get your free quote</h1>
    <p id="subtitle">Fill this in and we'll call you right away.</p>
    <form id="lead">
      <label for="client">Demo business</label>
      <select id="client" name="client_id">
        <option value="sunpeak-solar" data-title="Get your free solar savings quote">SunPeak Solar</option>
        <option value="glow-medspa" data-title="Book a free skin consultation">Glow Med Spa</option>
        <option value="summit-roofing" data-title="Get a free roof inspection">Summit Roofing</option>
      </select>
      <label for="name">Name</label>
      <input id="name" name="name" required autocomplete="name">
      <label for="phone">Mobile number</label>
      <input id="phone" name="phone" type="tel" required autocomplete="tel" placeholder="(512) 555-0142">
      <label for="message">Anything we should know?</label>
      <textarea id="message" name="message" rows="3" placeholder="e.g. my bill is about $250 a month"></textarea>
      <button id="submit" type="submit">Call me now</button>
    </form>
    <div id="status"></div>
  </div>
</main>
<script>
  // Point this at the n8n webhook (…/webhook/speed-to-lead) or the Worker (…/leads).
  const ENDPOINT = "https://YOUR-WORKER.workers.dev/leads";

  const form = document.getElementById("lead"), status = document.getElementById("status"), sel = document.getElementById("client");
  const setTitle = () => { document.getElementById("title").textContent = sel.selectedOptions[0].dataset.title; };
  sel.addEventListener("change", setTitle); setTitle();

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = document.getElementById("submit"); btn.disabled = true;
    const started = Date.now();
    status.innerHTML = 'Sending… <span class="timer">0.0s</span>';
    const tick = setInterval(() => { const t = status.querySelector(".timer"); if (t) t.textContent = ((Date.now() - started) / 1000).toFixed(1) + "s"; }, 100);
    try {
      const res = await fetch(ENDPOINT, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(Object.fromEntries(new FormData(form))) });
      const data = await res.json();
      if (!res.ok || !data.ok) throw new Error(data.error || res.status);
      status.innerHTML = `📞 ${data.message} Your phone should ring within 30 seconds. <span class="timer"></span>`;
    } catch (err) {
      status.textContent = "Couldn't start the call: " + err.message;
    } finally {
      setTimeout(() => clearInterval(tick), 30000); btn.disabled = false;
    }
  });
</script>
</body>
</html>
